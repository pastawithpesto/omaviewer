[package]
name = "windowlink-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hyprland host launcher for WindowLink"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
libc = "0.2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
portable-pty = "0.9"
